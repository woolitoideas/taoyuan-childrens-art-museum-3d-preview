<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23ef8538'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='40' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
  <meta name="description" content="桃園兒童美術館「問題長出來」新版場地配置 3D 概念示意。">
  <title>問題長出來｜新版場地 3D 示意</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:#27343a;background:#f4f0e9}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    .app{display:grid;grid-template-columns:minmax(235px,280px) minmax(0,1fr);min-height:100vh}
    aside{padding:30px 23px;background:#f4f0e9;border-right:1px solid #ddd8ce;display:flex;flex-direction:column;gap:18px}
    .eyebrow{color:#bf632c;font-size:11px;font-weight:800;letter-spacing:.1em}
    h1{margin:0;font-size:clamp(30px,3vw,42px);line-height:1.15;letter-spacing:-.06em}h1 span{display:block;color:#e87838}
    .lead{font-size:13px;line-height:1.8;color:#536166;margin:0}
    .legend{list-style:none;margin:3px 0 0;padding:0;display:grid;gap:11px}.legend li{font-size:13px;display:flex;align-items:center;gap:10px;line-height:1.4}.dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--c)}
    .note{margin-top:auto;padding-top:18px;border-top:1px solid #ddd8ce;font-size:11px;color:#6b7778;line-height:1.7}
    .stage{position:relative;min-width:0;min-height:100vh;overflow:hidden;background:#e9e5df}
    canvas{width:100%;height:100%;min-height:100vh;display:block;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}
    .topline,.bottomline{position:absolute;pointer-events:none;background:#fffdf8d9;border:1px solid #ded8cc;border-radius:8px;color:#526064;font-size:11px;padding:9px 12px}
    .topline{top:20px;right:20px}.bottomline{bottom:20px;left:20px}
    @media(max-width:780px){.app{display:block}aside{padding:19px;border-right:0;border-bottom:1px solid #ddd8ce;gap:9px}h1{font-size:28px}h1 span{display:inline}.lead{font-size:12px}.legend{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px 5px}.legend li{font-size:10px;gap:5px}.dot{width:7px;height:7px}.note{margin:3px 0 0;padding-top:8px;font-size:10px}.stage,canvas{min-height:65vh}.topline{top:10px;right:10px}.bottomline{bottom:10px;left:10px}}
  </style>
</head>
<body>
  <main class="app">
    <aside>
      <div class="eyebrow">好廢的問卷 × 桃園兒童美術館</div>
      <h1>問題<span>長出來</span></h1>
      <p class="lead">新版場地配置概念示意。藍色矮桌與平台僅標示展品大致位置，不代表最終形狀、尺寸或擺位。</p>
      <ul class="legend" aria-label="展品位置">
        <li><i class="dot" style="--c:#d99658"></i>蜘蛛腿</li>
        <li><i class="dot" style="--c:#d7849e"></i>美甲</li>
        <li><i class="dot" style="--c:#7e9bb2"></i>排鞋子</li>
        <li><i class="dot" style="--c:#8bad79"></i>掛衣服</li>
        <li><i class="dot" style="--c:#bd97b9"></i>紙娃娃貼紙</li>
        <li><i class="dot" style="--c:#e0aa61"></i>蓋章</li>
        <li><i class="dot" style="--c:#70a7a9"></i>投袋子</li>
        <li><i class="dot" style="--c:#e5b775"></i>光影印章</li>
      </ul>
      <p class="note">平面位置依「場地／場地配置.png」。展品外觀、矮桌高度與入口皆為概念示意，非施工圖。</p>
    </aside>
    <section class="stage" aria-label="問題長出來新版 3D 場地配置">
      <canvas id="view" role="img" aria-label="L 形展區的 3D 概念示意：上方為蜘蛛腿、美甲、排鞋子；右側轉角掛衣服；下方依序是紙娃娃貼紙和蓋章；左側玻璃旁為光影印章及投袋子；入口在排鞋子側。可拖曳旋轉與滾輪縮放。"></canvas>
      <div class="topline">新版配置 · 概念示意 · 公開預覽</div>
      <div class="bottomline">拖曳旋轉 · 滾輪縮放 · 入口在排鞋子側</div>
    </section>
  </main>
  <script src="./viewer.js"></script>
</body>
</html>
